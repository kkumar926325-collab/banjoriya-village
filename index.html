<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Banjoriya Village</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7f2;
  color:#222;
}

.top{
  text-align:center;
  padding:22px 15px;
  background:white;
}

.logo{
  width:110px;
  height:110px;
  object-fit:contain;
  border-radius:50%;
}

.title{
  font-size:25px;
  font-weight:bold;
  margin-top:8px;
  letter-spacing:2px;
}

.hero{
  height:58vh;
  min-height:400px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;

  background:
    linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.55)),
    url("photos/village.jpg") center/cover no-repeat;

  animation:heroIn 1.2s ease;
}

.hero h1{
  color:white;
  font-size:clamp(42px,12vw,75px);
  text-shadow:0 4px 15px #000;
}

.section{
  max-width:1100px;
  margin:auto;
  padding:45px 18px;
}

.section h2{
  text-align:center;
  font-size:30px;
  margin-bottom:25px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  overflow:hidden;
  border-radius:18px;
  background:white;
  box-shadow:0 6px 20px rgba(0,0,0,.15);
  animation:cardIn .8s ease;
}

.card img,
.card video{
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
}

.card img{
  cursor:pointer;
  transition:.4s;
}

.card img:hover{
  transform:scale(1.05);
}

footer{
  text-align:center;
  padding:28px;
  background:#111;
  color:white;
}

#viewer{
  display:none;
  position:fixed;
  z-index:999;
  inset:0;
  background:rgba(0,0,0,.92);
  align-items:center;
  justify-content:center;
  padding:20px;
}

#viewer img{
  max-width:95%;
  max-height:90%;
  border-radius:12px;
}

.close{
  position:absolute;
  top:15px;
  right:25px;
  color:white;
  font-size:40px;
  cursor:pointer;
}

@keyframes heroIn{
  from{opacity:0;transform:scale(1.03)}
  to{opacity:1;transform:scale(1)}
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(25px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
<meta name="google-site-verification" content="7UvQr1PzOiTl41n7ADAwbje_gcqkFvV6hw4w7HEv1rM" />
</head>

<body>

<div class="top">
  <img src="photos/logo.png" class="logo" alt="Banjoriya Village Logo">
  <div class="title">BANJORIYA VILLAGE</div>
</div>

<div class="hero">
  <h1>Banjoriya ❤️</h1>
</div>

<section class="section">
  <h2>📸 Photos</h2>

  <div class="gallery">

    <div class="card">
      <img src="photos/village.jpg"
           alt="Banjoriya Village"
           onclick="openPhoto(this.src)">
    </div>

  </div>
</section>

<section class="section">
  <h2>🎥 Videos</h2>

  <div class="gallery">

    <div class="card">
      <video controls>
        <source src="videos/village.mp4" type="video/mp4">
      </video>
    </div>

  </div>
</section>

<footer>
  © Banjoriya Village
</footer>

<div id="viewer" onclick="closePhoto()">
  <span class="close">×</span>
  <img id="bigPhoto">
</div>

<script>
function openPhoto(src){
  document.getElementById("bigPhoto").src=src;
  document.getElementById("viewer").style.display="flex";
}

function closePhoto(){
  document.getElementById("viewer").style.display="none";
}
</script>

</body>
</html>
